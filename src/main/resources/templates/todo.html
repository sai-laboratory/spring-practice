<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Todoアプリ</title>
    <style>
        .done { text-decoration: line-through; color: #888; }
        ul { list-style: none; padding: 0; }
        li { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    </style>
</head>
<body>
    <h1>Todoリスト</h1>

    <form th:action="@{/todo}" method="post" name="newTodo">
        <input type="text" name="title" placeholder="新しいタスクを入力" required>
        <button type="submit">追加</button>
    </form>

    <hr>

    <ul>
        <th:block th:each="todo : ${todos}">
            <li>
                <span th:text="${todo.title}" th:classappend="${todo.status == 1} ? 'done' : ''">タスク名</span>

                <form th:if="${todo.status == 0}" th:action="@{/todo/{id}/done(id=${todo.id})}" method="post">
                    <button type="submit">完了</button>
                </form>

                <form th:action="@{/todo/{id}/delete(id=${todo.id})}" method="post">
                    <button type="submit">削除</button>
                </form>
            </li>
        </th:block>
    </ul>
</body>
</html>
